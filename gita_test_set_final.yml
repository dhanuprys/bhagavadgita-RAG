- question: "Apa terjemahan dari Bab 18, sloka 66?"
  answer: "Terjemahan dari Bab 18, sloka 66 adalah: 'Meninggalkan semua Dharma sepenuhnya, carilah perlindungan pada-Ku saja. Aku akan membebaskanmu dari semua dosa; jangan berduka.'"

- question: "Apa arti dari Bab 2, sloka 13?"
  answer: "Arti dari Bab 2, sloka 13 adalah: 'Sama seperti diri yang berhubungan dengan tubuh melewati masa kanak-kanak, remaja, dan usia tua, demikian pula, saat mati, ia beralih ke tubuh lain. Orang bijak tidak tertipu oleh hal itu.'"

- question: "Dalam sloka pertama Bab 1, apa arti dari 'dharma-kṣhetre kuru-kṣhetre'?"
  answer: "Berdasarkan makna yang diberikan, 'dharma-kṣhetre' berarti 'tanah dharma' dan 'kuru-kṣhetre' berarti 'di Kurukshetra'."

