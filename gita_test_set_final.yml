- question: "Tolong rangkum secara singkat isi dari Bab 1 Bhagavad Gita."
  answer: "Bab 1, 'Dilema Arjuna' (Arjuna Viṣhād Yog), memperkenalkan latar belakang pertempuran Mahabharata dan menguraikan kesedihan serta keraguan Arjuna saat melihat kerabatnya di medan perang, yang membuatnya menyerah kepada Krishna untuk mencari solusi."

- question: "Jelaskan apa itu Karma Yoga berdasarkan Bab 3."
  answer: "Berdasarkan Bab 3, Karma Yoga adalah 'Jalan Pelayanan Tanpa Pamrih'. Ini menekankan pentingnya melakukan aktivitas tanpa terikat pada imbalan atau hasilnya demi mencapai pembebasan."

- question: "Menurut Bab 4, mengapa Krishna bereinkarnasi dari waktu ke waktu?"
  answer: "Menurut rangkuman Bab 4, Krishna bereinkarnasi dari waktu ke waktu untuk menegakkan kembali dharma (kebenaran) dan perdamaian di Bumi."

- question: "Apa perbedaan antara 'sanyas' dan 'tyaag' menurut Bab 18?"
  answer: "Menurut Bab 18, seorang 'sanyasi' adalah orang yang meninggalkan keluarga dan masyarakat, sedangkan seorang 'tyaagi' adalah orang yang melakukan tugasnya tanpa terikat pada hasil tindakannya dan mendedikasikannya kepada Tuhan."

- question: "Bab mana yang membahas tentang tiga guna alam material?"
  answer: "Bab 14, 'Yoga melalui Pemahaman Tiga Guna Alam Material', membahas tiga guna (mode) dari alam material – kebaikan, nafsu, dan kebodohan."

- question: "Menurut Bab 7, apa itu Maya?"
  answer: "Menurut Bab 7, Maya adalah energi ilusi Krishna di dunia material yang sangat sulit diatasi, tetapi mereka yang menyerahkan pikiran kepada-Nya akan dapat melampauinya."

- question: "Apa yang diungkapkan Krishna dalam Bab 11, 'Yoga melalui Melihat Wujud Kosmis Tuhan'?"
  answer: "Dalam Bab 11, atas permintaan Arjuna, Krishna menyingkapkan Wujud Kosmis Universal-Nya yang meliputi semua alam semesta. Arjuna dianugerahi penglihatan ilahi untuk dapat melihat keseluruhan ciptaan dalam tubuh Tuhan Tertinggi Krishna."

- question: "Apa dua jenis sifat manusia yang dijelaskan dalam Bab 16?"
  answer: "Bab 16 menjelaskan dua jenis sifat manusia, yaitu sifat ilahi (daivi) dan sifat setan (asuri)."

